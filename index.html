<!DOCTYPE html>
<html lang="en">
<head>

  <script src="https://cdn.botpress.cloud/webchat/v3.6/inject.js"></script>
  <script src="https://files.bpcontent.cloud/2026/02/11/15/20260211154729-FZV5ZH5A.js" defer></script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gonçalo Matias – Generative AI for Work & Research</title>
  <style>
    :root {
      --bg-main: #f7f9fc;
      --bg-soft: #eef3fb;
      --accent: #2563eb;
      --accent-2: #38bdf8;
      --text-main: #0f172a;
      --text-muted: #475569;
      --card-bg: #ffffff;
      --border-soft: #dbeafe;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, #c7dbff 0%, #eaf1ff 45%, #f7faff 100%);
      color: var(--text-main);
      line-height: 1.6;
    }

    header {
      padding: 4.5rem 2rem 3.5rem;
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 3rem;
      align-items: center;
    }

    @media (max-width: 900px) {
      header { grid-template-columns: 1fr; text-align: center; }
    }

    .hero h1 {
      font-size: 2.8rem;
      margin: 0 0 1rem;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      color: var(--text-muted);
      max-width: 560px;
    }

    .nav-buttons {
      margin-top: 1.8rem;
      display: flex;
      gap: 1rem;
      flex-wrap: nowrap;
      align-items: center;
    }

    .nav-buttons a {
      text-decoration: none;
      padding: 0.65rem 1.6rem;
      border-radius: 999px;
      border: 1px solid var(--border-soft);
      color: var(--accent);
      background: #ffffff;
      font-size: 0.9rem;
      font-weight: 600;
      min-width: 120px;
      text-align: center;
    }

    .nav-buttons a:hover {
      background: var(--accent);
      color: #ffffff;
    }

    .hero-image {
      width: 100%;
      max-width: 300px;
      border-radius: 999px;
      border: 4px solid var(--accent-2);
      box-shadow: 0 20px 40px rgba(15,23,42,0.15);
    }

    section {
      padding: 4rem 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    section h2 {
      font-size: 1.9rem;
      margin-bottom: 2rem;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-soft);
      border-radius: 18px;
      padding: 2rem;
      box-shadow: 0 10px 25px rgba(15,23,42,0.08);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.5rem;
    }

    .profile-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }

    @media (max-width: 900px) {
      .profile-grid { grid-template-columns: 1fr; }
    }

    .skills {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
    }

    .skill {
      border: 1px solid var(--border-soft);
      border-radius: 14px;
      padding: 1.1rem;
      background: rgba(255,255,255,0.05);
      display: flex;
      gap: 0.8rem;
      align-items: center;
      font-size: 0.9rem;
    }

    .skill span {
      font-size: 1.1rem;
      color: var(--accent);
      width: 22px;
      text-align: center;
    }

    details {
      border: 1px solid var(--border-soft);
      border-radius: 16px;
      padding: 1.4rem 1.6rem;
      background: #ffffff;
    }

    details summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-weight: 600;
      list-style: none;
    }

    details summary::-webkit-details-marker { display: none; }

    details p {
      color: var(--text-muted);
      margin-top: 1rem;
    }

    .expand-btn {
      padding: 0.3rem 0.8rem;
      border-radius: 999px;
      border: 1px solid var(--border-soft);
      background: #ffffff;
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 600;
    }

    details[open] .expand-btn {
      background: var(--accent);
      color: #ffffff;
    }

    .week {
      padding: 1.5rem;
      border-radius: 16px;
      border: 1px solid var(--border-soft);
      background: #ffffff;
    }

    .week h3 {
      margin-top: 0;
      font-size: 1.05rem;
      color: var(--accent);
    }

    .week span {
      font-size: 1.4rem;
      margin-right: 0.4rem;
    }

    footer {
      text-align: center;
      padding: 3rem 1.5rem 4rem;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<!-- TOP BAR / HERO -->
<header style="padding:2.5rem 2rem 2rem; max-width:1200px; margin:0 auto; display:flex; justify-content:space-between; align-items:flex-start;">
  <div style="display:flex; align-items:center; gap:2rem; flex-wrap:wrap;">
    <img src="https://github.com/Goncalo-coder/graph-ai-portfolio-1/blob/main/Goncalo.jpg?raw=true" alt="Gonçalo Matias portrait" class="hero-image" />
    <div style="flex:1; min-width:260px; margin-left:2.5rem;">
      <h1>Gonçalo Matias</h1>
      <p style="max-width:700px; color:var(--text-muted); margin-left:1.5rem;">
        Senior epidemiologist with international experience in vaccines, epidemic preparedness and infectious disease research. Portfolio for the <strong>Generative AI for Work & Research</strong> course.
      </p>
      <div class="nav-buttons" style="margin-left:2.5rem; justify-content:flex-end;">
        <a href="#about">About me</a>
        <a href="#course">The course</a>
        <a href="#submissions">Submissions</a>
      </div>
    </div>
  </div>
</header>

</body>
</html>
